name: Security scan

# Runs on every pull request and on pushes to main. No Docker, no secrets, no
# external services — a self-contained static-site security check plus GitHub's
# own secret scanner. Fails the PR if a hardening rule regresses.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static-site security check (CSP, secrets, unsafe patterns)
        run: python3 tools/security_check.py

      # Run the gitleaks CLI directly instead of gitleaks-action@v2: the action
      # requires a licence for organisations and posts to the API, which made it
      # fail on every PR. The CLI needs neither — it just scans and sets the exit
      # code (0 = clean, 1 = a secret was found).
      - name: Secret scan (gitleaks)
        run: |
          VER=8.18.4
          curl -sSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
