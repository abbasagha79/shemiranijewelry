name: Security scan

# Runs on every pull request and on pushes to main. No Docker, no secrets, no
# external services — a self-contained static-site security check plus GitHub's
# own secret scanner. Fails the PR if a hardening rule regresses.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static-site security check (CSP, secrets, unsafe patterns)
        run: python3 tools/security_check.py

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
