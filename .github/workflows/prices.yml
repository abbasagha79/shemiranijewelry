name: Refresh prices
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_prices.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "shemirani-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
